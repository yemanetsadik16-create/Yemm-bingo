name: Firestore Rules Test

on:
  push:
    paths:
      - "firestore.rules"
      - "firestore.test.js"
      - "firebase.json"
      - ".github/workflows/rules-test.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore.test.js"
      - "firebase.json"
      - ".github/workflows/rules-test.yml"
  workflow_dispatch:

jobs:
  test-rules:
    name: Test Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Firebase CLI & Rules Unit Testing
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase

      - name: Run Firestore Rules Tests via Emulator
        run: |
          firebase emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"
